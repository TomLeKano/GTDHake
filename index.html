<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#8B6F47">
    <title>GTDHack — Capture & Structuration</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --clay: #8B6F47;
            --blue: #185FA5;
            --surface-light: #F8F7F5;
            --surface-card: #FFFFFF;
            --text-primary: #1A1A1A;
            --text-secondary: #666;
            --border: #E5E3E0;
            --success: #10B981;
            --warning: #F59E0B;
            --danger: #EF4444;
        }

        html, body {
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: linear-gradient(135deg, var(--surface-light) 0%, #FAFAF8 100%);
            color: var(--text-primary);
        }

        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-width: 640px;
            margin: 0 auto;
            padding: 12px;
            gap: 12px;
        }

        .header { flex-shrink: 0; padding-top: 8px; }
        .header h1 { font-size: 22px; font-weight: 600; margin-bottom: 2px; }
        .header p { font-size: 12px; color: var(--text-secondary); line-height: 1.4; }

        .pulse-dot {
            display: inline-block; width: 8px; height: 8px;
            background: var(--clay); border-radius: 50%;
            margin-right: 6px; animation: pulse 2s infinite;
        }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

        .security-badge {
            display: inline-flex; align-items: center; gap: 4px;
            background: rgba(16,185,129,.08); color: var(--success);
            font-size: 11px; padding: 4px 8px; border-radius: 4px;
            margin-top: 6px; border: .5px solid rgba(16,185,129,.3);
        }

        /* ===== SCREENS ===== */
        .screen { flex: 1; display: none; flex-direction: column; gap: 10px; min-height: 0; }
        .screen.active { display: flex; }

        /* ===== CAPTURE SCREEN ===== */
        textarea {
            flex: 1; padding: 12px; border: 1px solid var(--border); border-radius: 8px;
            font-family: inherit; font-size: 14px; line-height: 1.6; resize: none;
            background: var(--surface-card); color: var(--text-primary); transition: all .2s;
        }
        textarea:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px rgba(24,95,165,.08); }
        textarea::placeholder { color: #AAA; }
        textarea.recording { border-color: var(--danger); box-shadow: 0 0 0 3px rgba(239,68,68,.1); }

        .input-controls { display: flex; gap: 8px; flex-shrink: 0; flex-wrap: wrap; }

        .btn {
            padding: 10px 12px; border: 1px solid; border-radius: 6px; font-size: 12px;
            font-weight: 500; cursor: pointer; transition: all .15s; display: flex;
            align-items: center; justify-content: center; gap: 6px; white-space: nowrap; min-height: 36px;
        }
        .btn-voice { background: var(--surface-card); color: var(--text-secondary); border-color: var(--border); flex: 1; }
        .btn-voice:hover:not(:disabled) { border-color: var(--blue); color: var(--blue); }
        .btn-voice.recording { background: rgba(239,68,68,.1); color: var(--danger); border-color: var(--danger); animation: recPulse 1.5s ease-in-out infinite; }
        @keyframes recPulse { 0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.3)} 50%{box-shadow:0 0 0 4px rgba(239,68,68,.1)} }

        .btn-send { background: var(--clay); color: #fff; border-color: var(--clay); flex: 1; }
        .btn-send:hover:not(:disabled) { background: #9B7D57; border-color: #9B7D57; }
        .btn-send:active:not(:disabled) { transform: scale(.98); }

        .btn-clear { background: transparent; color: var(--text-secondary); border-color: var(--border); }
        .btn-clear:hover { background: var(--surface-light); border-color: var(--text-secondary); }

        .btn-notion { background: var(--blue); color: #fff; border-color: var(--blue); flex: 2; }
        .btn-notion:hover:not(:disabled) { background: #14488a; }

        .btn-back { background: transparent; color: var(--text-secondary); border-color: var(--border); flex: 1; }

        .btn:disabled { opacity: .5; cursor: not-allowed; }

        .voice-indicator { font-size: 10px; color: var(--text-secondary); display: none; }
        .voice-indicator.show { display: block; }

        /* ===== REVIEW SCREEN ===== */
        .review-header {
            display: flex; justify-content: space-between; align-items: center; flex-shrink: 0;
        }
        .review-count { font-size: 13px; color: var(--text-secondary); }

        .review-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; min-height: 0; }

        .task-card {
            background: var(--surface-card); border: 1px solid var(--border); border-radius: 10px;
            padding: 12px; display: flex; flex-direction: column; gap: 8px; animation: slideIn .25s ease;
        }
        @keyframes slideIn { from{opacity:0; transform:translateY(-6px)} to{opacity:1; transform:translateY(0)} }

        .task-card-top { display: flex; gap: 6px; align-items: flex-start; }
        .task-title-input {
            flex: 1; font-size: 14px; font-weight: 600; border: 1px solid transparent;
            border-radius: 6px; padding: 6px 8px; background: transparent; color: var(--text-primary);
        }
        .task-title-input:focus { outline: none; border-color: var(--border); background: var(--surface-light); }

        .btn-delete {
            flex-shrink: 0; width: 28px; height: 28px; border-radius: 6px; border: 1px solid var(--border);
            background: transparent; color: var(--danger); cursor: pointer; font-size: 14px;
            display: flex; align-items: center; justify-content: center;
        }
        .btn-delete:hover { background: rgba(239,68,68,.08); border-color: var(--danger); }

        .task-row { display: flex; gap: 6px; flex-wrap: wrap; }

        select.task-select {
            font-size: 11px; padding: 5px 8px; border-radius: 5px; border: 1px solid var(--border);
            background: var(--surface-light); color: var(--text-primary); cursor: pointer;
        }

        .cat-chips { display: flex; gap: 4px; flex-wrap: wrap; }
        .cat-chip {
            font-size: 10px; padding: 4px 8px; border-radius: 10px; border: 1px solid var(--border);
            background: var(--surface-light); color: var(--text-secondary); cursor: pointer; user-select: none;
        }
        .cat-chip.active { background: rgba(24,95,165,.1); border-color: var(--blue); color: var(--blue); font-weight: 500; }

        .task-field {
            font-size: 12px; padding: 6px 8px; border: 1px solid var(--border); border-radius: 6px;
            background: var(--surface-light); color: var(--text-primary); width: 100%; resize: none;
            font-family: inherit; line-height: 1.4;
        }
        .task-field:focus { outline: none; border-color: var(--blue); background: var(--surface-card); }
        .task-field-label { font-size: 10px; color: var(--text-secondary); font-weight: 500; text-transform: uppercase; letter-spacing: .3px; }

        .field-group { display: flex; flex-direction: column; gap: 3px; }
        .field-hidden { display: none; }

        .subitems-list { display: flex; flex-direction: column; gap: 4px; }
        .subitem-row { display: flex; gap: 4px; align-items: center; }
        .subitem-input {
            flex: 1; font-size: 12px; padding: 5px 7px; border: 1px solid var(--border);
            border-radius: 5px; background: var(--surface-card);
        }
        .subitem-remove {
            width: 22px; height: 22px; border-radius: 5px; border: 1px solid var(--border);
            background: transparent; color: var(--text-secondary); cursor: pointer; font-size: 12px;
            flex-shrink: 0; display: flex; align-items: center; justify-content: center;
        }
        .btn-add-subitem {
            font-size: 11px; padding: 5px 8px; border-radius: 5px; border: 1px dashed var(--border);
            background: transparent; color: var(--text-secondary); cursor: pointer; align-self: flex-start;
        }
        .btn-add-subitem:hover { border-color: var(--blue); color: var(--blue); }

        .status { padding: 10px 12px; border-radius: 6px; font-size: 12px; border: .5px solid; display: none;
            align-items: center; gap: 8px; flex-shrink: 0; }
        .status.show { display: flex; }
        .status-loading { background: rgba(24,95,165,.06); border-color: var(--blue); color: var(--blue); }
        .status-success { background: rgba(16,185,129,.06); border-color: var(--success); color: var(--success); }
        .status-error { background: rgba(239,68,68,.06); border-color: var(--danger); color: var(--danger); }

        .spinner { width: 12px; height: 12px; border: 2px solid currentColor; border-top-color: transparent;
            border-radius: 50%; animation: spin .7s linear infinite; flex-shrink: 0; }
        @keyframes spin { to{transform:rotate(360deg)} }

        .info-box {
            background: rgba(139,111,71,.05); border: .5px solid rgba(139,111,71,.15); border-radius: 6px;
            padding: 9px 11px; font-size: 11px; color: var(--text-secondary); line-height: 1.4; flex-shrink: 0;
        }
        .info-box strong { color: var(--text-primary); }

        @media (max-width: 480px) {
            .container { padding: 10px; gap: 10px; }
            .header h1 { font-size: 20px; }
            .btn { font-size: 11px; padding: 9px 10px; min-height: 34px; }
            textarea { font-size: 13px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><span class="pulse-dot"></span>GTDHack</h1>
            <p id="headerSubtitle">Dicter, copier, coller. IA structure en temps réel.</p>
            <div class="security-badge">🔒 Données locales · Zéro historique</div>
        </div>

        <!-- ===== CAPTURE SCREEN ===== -->
        <div class="screen active" id="captureScreen">
            <textarea id="notesInput" placeholder="Tape ou dicte:&#10;- Fix pool&#10;- P1: Landing Ekano&#10;- Ranger perceuse garage&#10;- Idée article IA&#10;- Appeler l'organisateur du mariage: 2 pupitres possibles? Point électrique? Écran diffuseur?" autofocus></textarea>

            <div class="voice-indicator" id="voiceIndicator">Écoute...</div>

            <div class="input-controls">
                <button class="btn btn-voice" id="voiceBtn" title="Dicter">🎤 Dicter</button>
                <button class="btn btn-voice" id="pasteBtn" title="Coller depuis le clipboard">📋 Coller</button>
            </div>
            <div class="input-controls">
                <button class="btn btn-send" id="sendBtn">Structurer</button>
                <button class="btn btn-clear" id="clearBtn">Effacer</button>
            </div>

            <div class="status" id="statusCapture"></div>

            <div class="info-box">
                <strong>💡 Confidentialité:</strong> Tout reste sur ton appareil. Données anonymes envoyées à Claude pour structuration uniquement, puis supprimées. Zéro historique serveur.
            </div>
        </div>

        <!-- ===== REVIEW SCREEN ===== -->
        <div class="screen" id="reviewScreen">
            <div class="review-header">
                <span class="review-count" id="reviewCount">0 élément(s)</span>
                <button class="btn btn-back" id="backBtn" style="flex: none; padding: 6px 12px;">← Retour</button>
            </div>

            <div class="review-list" id="reviewList"></div>

            <div class="status" id="statusReview"></div>

            <div class="input-controls">
                <button class="btn btn-notion" id="notionBtn">📤 Envoyer à Notion</button>
            </div>
        </div>
    </div>

    <script>
        // ============= CONFIG =============
        const NOTION_ENDPOINT = '/api/create-tasks';
        const CATEGORIES = ['Ekano', 'Perso', 'Maison/Garage', 'Soleil Bleu Azur', 'Autre'];

        // ============= STATE =============
        let reviewTasks = [];
        let isSending = false;
        let isPushing = false;
        let recognition = null;
        let isListening = false;

        // ============= DOM =============
        const notesInput = document.getElementById('notesInput');
        const sendBtn = document.getElementById('sendBtn');
        const clearBtn = document.getElementById('clearBtn');
        const voiceBtn = document.getElementById('voiceBtn');
        const pasteBtn = document.getElementById('pasteBtn');
        const voiceIndicator = document.getElementById('voiceIndicator');
        const statusCapture = document.getElementById('statusCapture');
        const statusReview = document.getElementById('statusReview');
        const captureScreen = document.getElementById('captureScreen');
        const reviewScreen = document.getElementById('reviewScreen');
        const reviewList = document.getElementById('reviewList');
        const reviewCount = document.getElementById('reviewCount');
        const backBtn = document.getElementById('backBtn');
        const notionBtn = document.getElementById('notionBtn');

        // ============= SPEECH RECOGNITION =============
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.lang = 'fr-FR';
            recognition.interimResults = true;
            recognition.continuous = true;

            recognition.onstart = () => {
                isListening = true;
                voiceBtn.classList.add('recording');
                voiceIndicator.classList.add('show');
                notesInput.classList.add('recording');
                voiceBtn.textContent = '⏹️ Arrêter';
            };
            recognition.onresult = (event) => {
                let interim = '';
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    const transcript = event.results[i][0].transcript;
                    if (event.results[i].isFinal) {
                        notesInput.value += (notesInput.value ? ' ' : '') + transcript;
                    } else {
                        interim += transcript;
                    }
                }
                if (interim) voiceIndicator.textContent = `Écoute: "${interim}"`;
            };
            recognition.onend = () => {
                isListening = false;
                voiceBtn.classList.remove('recording');
                voiceIndicator.classList.remove('show');
                notesInput.classList.remove('recording');
                voiceBtn.textContent = '🎤 Dicter';
            };
            recognition.onerror = (event) => {
                showStatus(statusCapture, `Erreur micro: ${event.error}`, 'error');
                recognition.onend();
            };
        }

        voiceBtn.addEventListener('click', () => {
            if (!recognition) { showStatus(statusCapture, 'Micro non supporté', 'error'); return; }
            isListening ? recognition.stop() : recognition.start();
        });

        pasteBtn.addEventListener('click', async () => {
            try {
                const text = await navigator.clipboard.readText();
                if (text) {
                    notesInput.value += (notesInput.value ? '\n' : '') + text;
                    notesInput.focus();
                    showStatus(statusCapture, '✓ Collé depuis clipboard', 'success');
                    setTimeout(() => statusCapture.classList.remove('show'), 2000);
                } else {
                    showStatus(statusCapture, 'Clipboard vide', 'error');
                }
            } catch (error) {
                showStatus(statusCapture, 'Impossible de lire le clipboard. Colle manuellement (Cmd+V).', 'error');
            }
        });

        clearBtn.addEventListener('click', () => {
            notesInput.value = '';
            statusCapture.classList.remove('show');
            notesInput.focus();
        });

        notesInput.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') processNotes();
        });

        backBtn.addEventListener('click', () => {
            reviewScreen.classList.remove('active');
            captureScreen.classList.add('active');
        });

        // ============= PARSING HELPERS =============
        function splitIntoItems(text) {
            return text.split('\n')
                .map(l => l.trim())
                .filter(l => l.length > 0)
                .filter(l => !/^[-*•\s]*\[x\]/i.test(l))
                .map(l => l.replace(/^[-*•\s]*\[\s?\]\s*/, '').replace(/^[-*•\s]+/, '').trim())
                .filter(l => l.length > 0);
        }

        function chunkArray(arr, size) {
            const chunks = [];
            for (let i = 0; i < arr.length; i += size) chunks.push(arr.slice(i, i + size));
            return chunks;
        }

        function repairTruncatedJson(text) {
            const objects = [];
            let depth = 0, start = -1, inString = false, escape = false;
            for (let i = 0; i < text.length; i++) {
                const ch = text[i];
                if (escape) { escape = false; continue; }
                if (ch === '\\') { escape = true; continue; }
                if (ch === '"') { inString = !inString; continue; }
                if (inString) continue;
                if (ch === '{') { if (depth === 0) start = i; depth++; }
                else if (ch === '}') {
                    depth--;
                    if (depth === 0 && start !== -1) {
                        const candidate = text.slice(start, i + 1);
                        try { objects.push(JSON.parse(candidate)); } catch (e) {}
                        start = -1;
                    }
                }
            }
            return objects;
        }

        function parseTasksResponse(responseText) {
            let text = responseText.trim().replace(/```json\n?/g, '').replace(/```\n?/g, '').trim();
            try { return JSON.parse(text); }
            catch (e1) {
                const jsonMatch = text.match(/\[[\s\S]*\]/);
                if (jsonMatch) {
                    try { return JSON.parse(jsonMatch[0]); } catch (e2) {}
                }
                const repaired = repairTruncatedJson(text);
                if (repaired.length > 0) return repaired;
                console.error('Parse failed. Raw:', text.substring(0, 300));
                throw new Error('Format JSON invalide');
            }
        }

        function normalizeTask(t) {
            return {
                Type: t.Type || 'Tâche',
                Titre: t.Titre || 'Sans titre',
                Priorité: t.Priorité || 'P2',
                Catégorie: Array.isArray(t.Catégorie) ? t.Catégorie : (t.Catégorie ? [t.Catégorie] : ['Autre']),
                'Contexte/Raison': t['Contexte/Raison'] || '',
                'Action à faire': t['Action à faire'] || '',
                'Sous-éléments': Array.isArray(t['Sous-éléments']) ? t['Sous-éléments'] : [],
                'Objet rangé': t['Objet rangé'] || '',
                Localisation: t.Localisation || '',
                Idée: t.Idée || '',
                Statut: 'Pas commencé'
            };
        }

        // ============= CLAUDE API CALL =============
        async function callClaudeForBatch(itemsText) {
            const response = await fetch('https://api.anthropic.com/v1/messages', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    model: 'claude-sonnet-4-6',
                    max_tokens: 4096,
                    messages: [{
                        role: 'user',
                        content: `STRICT JSON OUTPUT ONLY. No markdown, no explanation, no text before or after.

Return a JSON array. Each element:
{"Type":"Tâche|Idée|Rangement","Titre":"TEXT","Priorité":"P1|P2|P3","Catégorie":["CAT"],"Contexte/Raison":"TEXT","Action à faire":"TEXT","Sous-éléments":["TEXT","TEXT"],"Objet rangé":"TEXT","Localisation":"TEXT","Idée":"TEXT","Statut":"Pas commencé"}

FIELD RULES:
- Type: "Tâche" (action/todo), "Idée" (concept/reflection), "Rangement" (storage location)
- Titre: short, actionable (max 50 chars)
- Priorité: "P1" urgent/blocking, "P2" normal, "P3" can wait (only meaningful for Tâche)
- Catégorie: array from "Ekano","Perso","Maison/Garage","Soleil Bleu Azur","Autre"
- Contexte/Raison: why, max 60 chars, "" if none
- Action à faire: detailed action if Type=Tâche, else ""
- Sous-éléments: array of related sub-items (see CONSOLIDATION below), else []
- Objet rangé / Localisation: only if Type=Rangement
- Idée: only if Type=Idée

CONSOLIDATION (important):
If multiple notes refer to the SAME target (same person, same event, same call, same errand) and are naturally related questions or sub-actions, MERGE them into ONE task instead of creating separate tasks. Put the main umbrella action in "Titre"/"Action à faire", and list each individual related question/item in "Sous-éléments" (one string per item).
Example: notes "Mariage elo - 2 pupitres possibles" + "Où se trouve le point électrique pour le son" + "Écran avec diffuseur" all relate to preparing for the same wedding/event call → merge into ONE task: Titre="Appeler organisateur mariage Elo", Sous-éléments=["Vérifier si 2 pupitres possibles","Trouver le point électrique pour le son","Écran avec diffuseur ?"]
Do NOT merge unrelated items even if same category.

AUTO-DETECT category:
- Event/person names, personal errands → Perso
- pool/garage/maison/rangement → Maison/Garage
- "Ekano" → Ekano
- "Soleil"/"Bleu" → Soleil Bleu Azur
- else → Autre

NOTES TO PARSE (one item per line):
${itemsText}

RESPOND WITH ONLY THE JSON ARRAY. NO OTHER TEXT.`
                    }]
                })
            });
            if (!response.ok) throw new Error('API: ' + response.status);
            const data = await response.json();
            const raw = parseTasksResponse(data.content[0].text);
            return raw.map(normalizeTask);
        }

        async function processNotes() {
            const notes = notesInput.value.trim();
            if (!notes) { showStatus(statusCapture, 'Ajoute une note', 'error'); return; }
            if (isSending) return;
            isSending = true;
            sendBtn.disabled = true;

            const items = splitIntoItems(notes);
            const BATCH_SIZE = 6;
            const batches = items.length > 0 ? chunkArray(items, BATCH_SIZE) : [[notes]];

            let allTasks = [];

            try {
                for (let i = 0; i < batches.length; i++) {
                    showStatus(statusCapture, batches.length > 1 ? `Structuration… lot ${i + 1}/${batches.length}` : 'Structuration…', 'loading');
                    const batchText = batches[i].join('\n');
                    const tasks = await callClaudeForBatch(batchText);
                    allTasks = allTasks.concat(tasks);
                }

                reviewTasks = allTasks;
                renderReview();
                captureScreen.classList.remove('active');
                reviewScreen.classList.add('active');
                statusCapture.classList.remove('show');
                notesInput.value = '';

            } catch (error) {
                showStatus(statusCapture, `Erreur: ${error.message}`, 'error');
            } finally {
                isSending = false;
                sendBtn.disabled = false;
            }
        }
        sendBtn.addEventListener('click', processNotes);

        // ============= REVIEW SCREEN RENDERING =============
        function renderReview() {
            reviewList.innerHTML = '';
            reviewCount.textContent = `${reviewTasks.length} élément(s)`;

            reviewTasks.forEach((task, idx) => {
                reviewList.appendChild(buildTaskCard(task, idx));
            });
        }

        function buildTaskCard(task, idx) {
            const card = document.createElement('div');
            card.className = 'task-card';
            card.dataset.idx = idx;

            // Top row: title + delete
            const top = document.createElement('div');
            top.className = 'task-card-top';
            const titleInput = document.createElement('input');
            titleInput.className = 'task-title-input';
            titleInput.value = task.Titre;
            titleInput.addEventListener('input', () => { reviewTasks[idx].Titre = titleInput.value; });
            const delBtn = document.createElement('button');
            delBtn.className = 'btn-delete';
            delBtn.textContent = '✕';
            delBtn.title = 'Supprimer';
            delBtn.addEventListener('click', () => {
                reviewTasks.splice(idx, 1);
                renderReview();
            });
            top.appendChild(titleInput);
            top.appendChild(delBtn);
            card.appendChild(top);

            // Type + Priority selects
            const row1 = document.createElement('div');
            row1.className = 'task-row';

            const typeSelect = document.createElement('select');
            typeSelect.className = 'task-select';
            ['Tâche', 'Idée', 'Rangement'].forEach(t => {
                const opt = document.createElement('option');
                opt.value = t; opt.textContent = t;
                if (t === task.Type) opt.selected = true;
                typeSelect.appendChild(opt);
            });
            typeSelect.addEventListener('change', () => {
                reviewTasks[idx].Type = typeSelect.value;
                renderReview();
            });
            row1.appendChild(typeSelect);

            if (task.Type === 'Tâche') {
                const prioSelect = document.createElement('select');
                prioSelect.className = 'task-select';
                ['P1', 'P2', 'P3'].forEach(p => {
                    const opt = document.createElement('option');
                    opt.value = p; opt.textContent = p;
                    if (p === task.Priorité) opt.selected = true;
                    prioSelect.appendChild(opt);
                });
                prioSelect.addEventListener('change', () => { reviewTasks[idx].Priorité = prioSelect.value; });
                row1.appendChild(prioSelect);
            }
            card.appendChild(row1);

            // Category chips
            const catChips = document.createElement('div');
            catChips.className = 'cat-chips';
            CATEGORIES.forEach(cat => {
                const chip = document.createElement('span');
                chip.className = 'cat-chip' + (task.Catégorie.includes(cat) ? ' active' : '');
                chip.textContent = cat;
                chip.addEventListener('click', () => {
                    const cats = reviewTasks[idx].Catégorie;
                    const i = cats.indexOf(cat);
                    if (i >= 0) cats.splice(i, 1); else cats.push(cat);
                    renderReview();
                });
                catChips.appendChild(chip);
            });
            card.appendChild(catChips);

            // Context field
            const ctxGroup = document.createElement('div');
            ctxGroup.className = 'field-group';
            const ctxLabel = document.createElement('div');
            ctxLabel.className = 'task-field-label';
            ctxLabel.textContent = 'Contexte';
            const ctxInput = document.createElement('input');
            ctxInput.className = 'task-field';
            ctxInput.value = task['Contexte/Raison'];
            ctxInput.addEventListener('input', () => { reviewTasks[idx]['Contexte/Raison'] = ctxInput.value; });
            ctxGroup.appendChild(ctxLabel);
            ctxGroup.appendChild(ctxInput);
            card.appendChild(ctxGroup);

            // Type-specific fields
            if (task.Type === 'Tâche') {
                const actionGroup = document.createElement('div');
                actionGroup.className = 'field-group';
                const actionLabel = document.createElement('div');
                actionLabel.className = 'task-field-label';
                actionLabel.textContent = 'Action à faire';
                const actionInput = document.createElement('textarea');
                actionInput.className = 'task-field';
                actionInput.rows = 2;
                actionInput.value = task['Action à faire'];
                actionInput.addEventListener('input', () => { reviewTasks[idx]['Action à faire'] = actionInput.value; });
                actionGroup.appendChild(actionLabel);
                actionGroup.appendChild(actionInput);
                card.appendChild(actionGroup);

                // Sub-items
                const subGroup = document.createElement('div');
                subGroup.className = 'field-group';
                const subLabel = document.createElement('div');
                subLabel.className = 'task-field-label';
                subLabel.textContent = 'Sous-éléments liés';
                subGroup.appendChild(subLabel);

                const subList = document.createElement('div');
                subList.className = 'subitems-list';
                task['Sous-éléments'].forEach((item, subIdx) => {
                    subList.appendChild(buildSubitemRow(idx, subIdx, item));
                });
                subGroup.appendChild(subList);

                const addSubBtn = document.createElement('button');
                addSubBtn.className = 'btn-add-subitem';
                addSubBtn.textContent = '+ Ajouter un sous-élément';
                addSubBtn.addEventListener('click', () => {
                    reviewTasks[idx]['Sous-éléments'].push('');
                    renderReview();
                });
                subGroup.appendChild(addSubBtn);
                card.appendChild(subGroup);

            } else if (task.Type === 'Idée') {
                const ideaGroup = document.createElement('div');
                ideaGroup.className = 'field-group';
                const ideaLabel = document.createElement('div');
                ideaLabel.className = 'task-field-label';
                ideaLabel.textContent = 'Idée';
                const ideaInput = document.createElement('textarea');
                ideaInput.className = 'task-field';
                ideaInput.rows = 2;
                ideaInput.value = task.Idée;
                ideaInput.addEventListener('input', () => { reviewTasks[idx].Idée = ideaInput.value; });
                ideaGroup.appendChild(ideaLabel);
                ideaGroup.appendChild(ideaInput);
                card.appendChild(ideaGroup);

            } else if (task.Type === 'Rangement') {
                const objGroup = document.createElement('div');
                objGroup.className = 'field-group';
                const objLabel = document.createElement('div');
                objLabel.className = 'task-field-label';
                objLabel.textContent = 'Objet rangé';
                const objInput = document.createElement('input');
                objInput.className = 'task-field';
                objInput.value = task['Objet rangé'];
                objInput.addEventListener('input', () => { reviewTasks[idx]['Objet rangé'] = objInput.value; });
                objGroup.appendChild(objLabel);
                objGroup.appendChild(objInput);
                card.appendChild(objGroup);

                const locGroup = document.createElement('div');
                locGroup.className = 'field-group';
                const locLabel = document.createElement('div');
                locLabel.className = 'task-field-label';
                locLabel.textContent = 'Localisation';
                const locInput = document.createElement('input');
                locInput.className = 'task-field';
                locInput.value = task.Localisation;
                locInput.addEventListener('input', () => { reviewTasks[idx].Localisation = locInput.value; });
                locGroup.appendChild(locLabel);
                locGroup.appendChild(locInput);
                card.appendChild(locGroup);
            }

            return card;
        }

        function buildSubitemRow(taskIdx, subIdx, value) {
            const row = document.createElement('div');
            row.className = 'subitem-row';
            const input = document.createElement('input');
            input.className = 'subitem-input';
            input.value = value;
            input.addEventListener('input', () => {
                reviewTasks[taskIdx]['Sous-éléments'][subIdx] = input.value;
            });
            const removeBtn = document.createElement('button');
            removeBtn.className = 'subitem-remove';
            removeBtn.textContent = '✕';
            removeBtn.addEventListener('click', () => {
                reviewTasks[taskIdx]['Sous-éléments'].splice(subIdx, 1);
                renderReview();
            });
            row.appendChild(input);
            row.appendChild(removeBtn);
            return row;
        }

        // ============= SEND TO NOTION =============
        notionBtn.addEventListener('click', async () => {
            if (isPushing || reviewTasks.length === 0) return;
            isPushing = true;
            notionBtn.disabled = true;
            showStatus(statusReview, `Envoi de ${reviewTasks.length} élément(s) à Notion…`, 'loading');

            try {
                const response = await fetch(NOTION_ENDPOINT, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ tasks: reviewTasks })
                });

                if (!response.ok) {
                    const errText = await response.text();
                    throw new Error(`Serveur: ${response.status} — ${errText.substring(0, 150)}`);
                }

                const result = await response.json();
                showStatus(statusReview, `✓ ${result.count || reviewTasks.length} élément(s) envoyé(s) à Notion !`, 'success');
                reviewTasks = [];
                setTimeout(() => {
                    renderReview();
                    reviewScreen.classList.remove('active');
                    captureScreen.classList.add('active');
                    statusReview.classList.remove('show');
                }, 1500);

            } catch (error) {
                showStatus(statusReview, `Erreur envoi Notion: ${error.message}`, 'error');
            } finally {
                isPushing = false;
                notionBtn.disabled = false;
            }
        });

        // ============= UTILS =============
        function showStatus(el, message, type) {
            el.textContent = '';
            el.className = `status show status-${type}`;
            if (type === 'loading') {
                const spinner = document.createElement('div');
                spinner.className = 'spinner';
                el.appendChild(spinner);
            }
            const text = document.createElement('span');
            text.textContent = message;
            el.appendChild(text);
        }

        notesInput.focus();
        window.addEventListener('beforeunload', () => { if (recognition && isListening) recognition.stop(); });
    </script>
</body>
</html>
